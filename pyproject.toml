[project]
name = "computer-use"
dynamic = ["version"]
description = "LLM-discovered, typed computer-use capabilities with deterministic replay, safety guardrails, and same-session human handoff for legacy banking UIs."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/computer_use/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/computer_use"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
